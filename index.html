<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Flip Helper</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 30px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        .panel {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        label {
            font-size: 0.9em;
            color: #cccccc;
        }
        textarea, input {
            background-color: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .col {
            flex: 1;
        }
        button {
            background-color: #6200ea;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1em;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #7c4dff;
        }
        .card {
            background-color: #1e1e1e;
            border-left: 4px solid #00c853;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .card-title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 8px;
        }
        .card-details {
            display: flex;
            justify-content: space-between;
            color: #aaaaaa;
            font-size: 0.95em;
        }
        .gain {
            color: #00c853;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>CS2 Flip Helper</h2>

        <div class="panel">
            <label>Items to track (separated by commas):</label>
            <textarea id="itemsBox" rows="3">Prisma 2 Case, Danger Zone Case, AK-47 | Redline (Field-Tested)</textarea>

            <div class="row">
                <div class="col">
                    <label>Min ROI (%):</label>
                    <input type="number" id="minRoi" value="5.0" step="0.5">
                </div>
                <div class="col">
                    <label>Min Profit ($):</label>
                    <input type="number" id="minProfit" value="0.50" step="0.10">
                </div>
            </div>

            <button onclick="runScan()">Check Target Items</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        async function runScan() {
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "<p>Scanning CSFloat...</p>";

            const rawText = document.getElementById("itemsBox").value;
            const items = rawText.split(",").map(i => i.trim()).filter(i => i.length > 0);
            const minRoi = parseFloat(document.getElementById("minRoi").value) || 0;
            const minProfit = parseFloat(document.getElementById("minProfit").value) || 0;

            const payload = {
                items: items,
                min_roi: minRoi,
                min_profit: minProfit
            };

            try {
                const res = await fetch("http://127.0.0.1:8000/api/deals", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                resultsDiv.innerHTML = "";

                if (data.deals.length === 0) {
                    resultsDiv.innerHTML = "<p style='color: #ff5252;'>No deals matched your criteria.</p>";
                    return;
                }

                data.deals.forEach(deal => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <div class="card-title">${deal.item}</div>
                        <div class="card-details">
                            <span>Buy: $${deal.buy_price.toFixed(2)}</span>
                            <span>Market Ref: $${deal.market_value.toFixed(2)}</span>
                            <span class="gain">Net Profit: +$${deal.profit.toFixed(2)} (${deal.roi.toFixed(1)}%)</span>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });
            } catch (err) {
                resultsDiv.innerHTML = "<p style='color: #ff5252;'>Could not reach backend. Verify Uvicorn is active.</p>";
            }
        }
    </script>
</body>
</html>
